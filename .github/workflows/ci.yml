name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  overlay:
    name: Overlay verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify upstream provenance and overlay idempotence
        run: |
          python3 -m py_compile android/scripts/apply-upstream-overlay.py
          python3 -m py_compile android/scripts/verify-upstream-overlay.py
          python3 android/scripts/verify-upstream-overlay.py
          # Ensure fork does not claim clean upstream sync when overlay is absent:
          # If src/hermes-runtime.ts missing or package exports missing, verification would have failed above.
          # Also ensure second apply is no-op (verified inside verify script).

  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run check

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check for uncommitted changes
        run: git diff --exit-code
