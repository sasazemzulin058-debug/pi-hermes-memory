name: Sync upstream

on:
  schedule:
    - cron: '0 3 * * 1' # weekly Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/chandra447/pi-hermes-memory.git || git remote set-url upstream https://github.com/chandra447/pi-hermes-memory.git
          git fetch upstream main --prune
          echo "upstream_SHA=$(git rev-parse upstream/main)" >> $GITHUB_ENV
          echo "upstream_short=$(git rev-parse --short upstream/main)" >> $GITHUB_ENV
          cat android/overlay/UPSTREAM || true

      - name: Verify overlay base matches upstream
        run: |
          set -euo pipefail
          upstream_sha=$(git rev-parse upstream/main)
          upstream_short=${upstream_sha:0:7}
          echo "upstream $upstream_sha ($upstream_short)"
          if [ ! -f android/overlay/UPSTREAM ]; then
            echo "::error::Provenance missing android/overlay/UPSTREAM"
            exit 1
          fi
          provenance_base=$(grep -E '^upstream_base=' android/overlay/UPSTREAM | cut -d= -f2 || echo "")
          provenance_full=$(grep -E '^upstream_commit=' android/overlay/UPSTREAM | cut -d= -f2 || echo "")
          if [ -z "$provenance_base" ]; then
            echo "::error::Provenance missing upstream_base"
            cat android/overlay/UPSTREAM
            exit 1
          fi
          # Check prefix match (provenance_base is short)
          if [[ "$upstream_sha" != "$provenance_base"* ]]; then
            echo "::error::Overlay base mismatch: provenance base $provenance_base != upstream $upstream_short ($upstream_sha)"
            echo "::error::Patch android/overlay/hermes-fork.patch was generated against $provenance_base but upstream is now $upstream_short"
            echo ""
            echo "Deterministic hermes-files overlay (android/overlay/hermes-files/) will still be applied,"
            echo "but patch requires regeneration for modified upstream files."
            echo ""
            echo "To fix, regenerate patch from current upstream + fork tree (excludes android scaffolding):"
            echo "  python3 android/scripts/regenerate-upstream-overlay.py --upstream upstream/main"
            echo "  git add android/overlay/hermes-fork.patch android/overlay/UPSTREAM"
            echo "  git commit -m \"chore(overlay): regenerate patch base ${upstream_short}\""
            echo ""
            echo "If hermes-files deterministic overlay is sufficient for current upstream (no conflicting changes),"
            echo "you may also update provenance base to $upstream_short after verifying markers via:"
            echo "  python3 android/scripts/verify-upstream-overlay.py"
            exit 1
          fi
          echo "provenance base ok: $provenance_base matches upstream $upstream_short"
          # Also validate patch applicability in dry-run before import
          if [ -f android/overlay/hermes-fork.patch ] && [ -s android/overlay/hermes-fork.patch ]; then
            if ! grep -q "overlay_format=patch" android/overlay/UPSTREAM; then
              echo "::warning::Provenance overlay_format unexpected"
            fi
          fi

      - name: Import upstream tree (preserve android and caches)
        run: |
          set -euo pipefail
          # Archive upstream main to temp and rsync excluding only fork-owned scaffolding
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          git archive upstream/main | tar -x -C "$tmp"
          # rsync upstream into working tree, preserving only fork-owned scaffolding
          # Keep .git (git metadata), android (overlay patch + scripts + hermes-files), and runtime caches
          # All other paths including .github and install-android.sh are replaced from upstream
          # so that overlay (patch + hermes-files) can re-apply them cleanly
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='android/' \
            --exclude='node_modules/' \
            --exclude='.pi/' \
            "$tmp"/ ./
          # Sync index to match upstream working tree for clean `git apply --3way`
          git add -A
          echo "import done"
          git status --porcelain | head -n 100

      - name: Apply overlay
        run: |
          set -euo pipefail
          python3 -m py_compile android/scripts/apply-upstream-overlay.py
          python3 -m py_compile android/scripts/verify-upstream-overlay.py
          python3 -m py_compile android/scripts/regenerate-upstream-overlay.py
          python3 android/scripts/apply-upstream-overlay.py
          python3 android/scripts/verify-upstream-overlay.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (lockfile-consistent)
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci || npm install; else npm install; fi

      - name: Type check
        run: |
          set -euo pipefail
          npm run check

      - name: Tests (full or focused per upstream CI)
        run: |
          set -euo pipefail
          # Upstream CI runs npm test via tests/run-all.sh ; respect TEST_TIMEOUT if set
          npm test



      - name: Commit & push if changed
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # provenance commit message includes upstream commit and overlay commit
          upstream_sha=$(git rev-parse upstream/main)
          overlay_sha=$(git rev-parse HEAD | cut -c1-7)
          # Use current overlay commit from provenance if available
          prov_overlay=$(grep -E '^overlay_commit=' android/overlay/UPSTREAM | cut -d= -f2 || echo "$overlay_sha")
          prov_base=$(grep -E '^upstream_base=' android/overlay/UPSTREAM | cut -d= -f2 || echo "${upstream_sha:0:7}")
          echo "committing sync: upstream $upstream_sha base $prov_base overlay $prov_overlay"
          git add -A
          # Ensure android scaffolding not accidentally committed as patch content leak
          if grep -q "diff --git a/android/overlay" android/overlay/hermes-fork.patch 2>/dev/null; then
            echo "::error::Patch contains android scaffolding — regeneration needed with :!android exclusion"
            exit 1
          fi
          git commit -m "chore(sync): mirror upstream ${upstream_sha} + overlay ${prov_overlay} (base ${prov_base})"
          git push origin HEAD:main

      - name: Notify conflict
        if: failure()
        run: |
          set -euo pipefail
          echo "::error::Sync failed — overlay base mismatch, patch conflict, or upstream incompatibility."
          echo "Check android/overlay/UPSTREAM provenance and hermes-fork.patch base."
          echo ""
          echo "If upstream advanced beyond provenance base, regenerate patch:"
          echo "  python3 android/scripts/regenerate-upstream-overlay.py --upstream upstream/main"
          echo "  git add android/overlay/hermes-fork.patch android/overlay/UPSTREAM"
          echo "  git commit -m \"chore(overlay): regenerate patch base \$(git rev-parse --short upstream/main)\""
          echo ""
          echo "Hermes-files deterministic overlay (android/overlay/hermes-files/) covers fork-owned new files"
          echo "and is applied even when patch base mismatches — but full sync requires patch regeneration"
          echo "for modified upstream files before build/tests can pass."
